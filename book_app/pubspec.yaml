name: book_app
description: A book marketplace and reading app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  http_parser: ^4.0.0
  web: ^1.0.0
  flutter_tts: ^4.0.2
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  provider: ^6.0.0
  file_picker: ^8.0.0
  image_picker: ^1.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.0
  app_links: ^6.3.0
  google_sign_in: ^6.2.1
  audioplayers: ^6.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true